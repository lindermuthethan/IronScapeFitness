<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Confirmed — IronScape Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --line: #262626;
    --lime: #84CC16;
    --lime-dim: #5c8f0f;
    --text: #f2f2f2;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 32px;
    text-align: center;
  }
  .mark {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .mark span { color: var(--lime); }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid var(--lime);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 26px; height: 26px; }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  p.body {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 0;
    background: var(--lime);
    color: #0a0a0a;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn:active { background: var(--lime-dim); }
  .fallback {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .fallback.hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">IRONSCAPE <span>FITNESS</span></div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#84CC16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>You're verified</h1>
    <p class="body">Your email is confirmed and your account is active. Open the app to log in and start training.</p>
    <a href="ironscape://" class="btn" id="openApp">Open IronScape Fitness</a>
    <p class="fallback" id="fallbackMsg">
      If nothing happens, make sure IronScape Fitness is installed, then come back and log in from the app.
    </p>
  </div>
  <script>
    // If the custom scheme fails to open the app (app not installed, or the
    // handoff is blocked), the fallback message stays visible so the user
    // isn't left with no explanation.
    var openLink = document.getElementById('openApp');
    openLink.addEventListener('click', function () {
      setTimeout(function () {
        document.getElementById('fallbackMsg').classList.remove('hidden');
      }, 1500);
    });
  </script>
</body>
</html>
